# Usage
#   docker compose --profile build run --rm builder   # (re)generate web/src/data/argus_graph.json from argus.events.json
#   docker compose up --build web                     # production build served by nginx -> http://localhost:8090 (override: WEB_PORT=9000)
#   docker compose --profile dev up web-dev           # Vite dev server with hot reload   -> http://localhost:5173
#   (web/web-dev now also start api + neo4j; run the loader once so Neo4j has data)
#   docker compose up -d neo4j                            # Neo4j Browser -> http://localhost:7474 (neo4j / $NEO4J_PASSWORD, default argus-password)
#   docker compose --profile load run --rm neo4j-loader   # load web/src/data/argus_graph.json into Neo4j
services:
  builder:
    profiles: ["build"]
    build: { context: ., dockerfile: Dockerfile.builder }
    environment: { PYTHONIOENCODING: utf8 }
    volumes:
      - ./argus.events.json:/work/argus.events.json:ro
      - ./web/src/data:/work/web/src/data

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    depends_on:
      neo4j: { condition: service_healthy }
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-argus-password}
    ports: ["127.0.0.1:${API_PORT:-3001}:3001"]
    restart: unless-stopped

  web:
    build: { context: ./web }
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-8090}:80"]
    restart: unless-stopped

  web-dev:
    profiles: ["dev"]
    build: { context: ./web, dockerfile: Dockerfile.dev }
    ports: ["127.0.0.1:5173:5173"]
    environment: { CHOKIDAR_USEPOLLING: "true", API_URL: "http://api:3001" }
    depends_on: [api]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-argus-password}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  neo4j-loader:
    profiles: ["load"]
    build: { context: ./neo4j }
    depends_on:
      neo4j: { condition: service_healthy }
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-argus-password}
    volumes:
      - ./web/src/data/argus_graph.json:/data/argus_graph.json:ro

volumes:
  web_node_modules:
  neo4j_data:
